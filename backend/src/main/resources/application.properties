spring.application.name=backend

# ──────────────────────────────────────────────────────────
# Gemini AI
# Set GEMINI_API_KEY as an environment variable on Render
# ──────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY}

# ──────────────────────────────────────────────────────────
# CORS allowed origins (comma-separated)
# Set APP_CORS_ORIGINS as env var on Render
# ──────────────────────────────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,https://smart-budgets-tracker.vercel.app}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=smartbudgettracker5@gmail.com
spring.mail.password=nothing
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.springframework.mail=DEBUG
spring.mail.properties.mail.debug=true